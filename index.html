<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100f0a" />
    <meta
      name="description"
      content="Bouslama Auto — pièces de rechange, entretien et services automobiles à Sousse. Plus de 12 000 références, livraison rapide partout en Tunisie."
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bouslama Auto" />
    <meta property="og:title" content="Bouslama Auto — Pièces & Services Automobiles" />

      property="og:description"
      content="Pièces de rechange, entretien et services automobiles à Sousse. Livraison rapide partout en Tunisie."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Variable fonts. Preconnect first so the TLS handshake overlaps with the
         HTML parse instead of blocking the font request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <title>Bouslama Auto — Pièces & Services Automobiles</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
